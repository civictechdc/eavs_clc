    description: "Text description for 'Other 1' mail ballots."

  - name: mail_other_2
    dtype: int64
    raw_name: C1h
    description: "Mail ballots categorized as 'Other 2'."

  - name: mail_other_2_text
    dtype: string
    raw_name: C1h_Other
    description: "Text description for 'Other 2' mail ballots."

  - name: mail_other_3
    dtype: int64
    raw_name: C1i
    description: "Mail ballots categorized as 'Other 3'."

  - name: mail_other_3_text
    dtype: string
    raw_name: C1i_Other
    description: "Text description for 'Other 3' mail ballots."

  - name: mail_comments
    dtype: string
    raw_name: C1Comments
    description: "General comments or notes regarding mail ballots."

