  # -------------------------------
  # Mail Ballot Variables (C1)
  # -------------------------------
  - name: mail_transmitted_total
    dtype: int64
    raw_name: C1a
    description: "Total number of mail ballots transmitted to voters."

  - name: mail_returned_by_voters
    dtype: int64
    raw_name: C1b
    description: "Number of mail ballots returned by voters."

  - name: mail_returned_undeliverable
    dtype: int64
    raw_name: C1c
    description: "Number of mail ballots returned as undeliverable."

  - name: mail_voided
    dtype: int64
    raw_name: C1d
    description: "Number of mail ballots voided by election officials."

  - name: mail_voted_in_person
    dtype: int64
