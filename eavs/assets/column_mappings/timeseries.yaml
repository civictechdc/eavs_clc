# Column mapping for the EAVS Time Series dataset v2.0 (2004–2024).
# Column names are the EAC stem names from the data file and User Guide v2.1.
# Names are the EAC's, per User Guide v2.1; project rename layer removed.
version: "2.0"
columns:
  # --- Infrastructure ---
  - raw_name: FIPSCode
    dtype: string

  - raw_name: Jurisdiction_Name
    dtype: string

  - raw_name: State_Full
    dtype: string

  - raw_name: State_Abbr
    dtype: string

  - raw_name: Year
    dtype: int64

  # --- Section F: Turnout ---
  - raw_name: turnout_tot
    dtype: int64

  - raw_name: turnout_ed
    dtype: int64

  - raw_name: turnout_uocava
    dtype: int64

  - raw_name: turnout_mail
    dtype: int64

  - raw_name: turnout_ev
    dtype: int64

  # --- Section A: Registration totals ---
  - raw_name: regist_tot
    dtype: int64

  - raw_name: regist_actv
    dtype: int64

  - raw_name: regist_inctv
    dtype: float64

  - raw_name: reg_tot
    dtype: int64

  - raw_name: reg_valid
    dtype: int64

  - raw_name: reg_prereg
    dtype: int64

  - raw_name: reg_dup
    dtype: int64

  # reg_rej = A3f in the 2024 survey instrument (renumbered from A3e in 2022).
  - raw_name: reg_rej
    dtype: int64

  - raw_name: reg_injurischng
    dtype: int64

  - raw_name: reg_outjurischng
    dtype: int64

  # --- Section A: Registration by channel ---
  - raw_name: regtot_mail
    dtype: int64

  - raw_name: regnew_mail
    dtype: int64

  - raw_name: regdup_mail
    dtype: int64

  - raw_name: regrej_mail
    dtype: int64

  - raw_name: regtot_inpers
    dtype: int64

  - raw_name: regnew_inpers
    dtype: int64

  - raw_name: regdup_inpers
    dtype: int64

  - raw_name: regrej_inpers
    dtype: int64

  - raw_name: regtot_online
    dtype: int64

  - raw_name: regnew_online
    dtype: int64

  - raw_name: regdup_online
    dtype: int64

  - raw_name: regrej_online
    dtype: int64

  - raw_name: regtot_dmv
    dtype: int64

  - raw_name: regnew_dmv
    dtype: int64

  - raw_name: regdup_dmv
    dtype: int64

  - raw_name: regrej_dmv
    dtype: int64

  - raw_name: regtot_nvra
    dtype: int64

  - raw_name: regnew_nvra
    dtype: int64

  - raw_name: regdup_nvra
    dtype: int64

  - raw_name: regrej_nvra
    dtype: int64

  - raw_name: regtot_stagncy
    dtype: int64

  - raw_name: regnew_stagncy
    dtype: int64

  - raw_name: regdup_stagncy
    dtype: int64

  - raw_name: regrej_stagncy
    dtype: int64

  # --- Section A: Confirmation notices ---
  - raw_name: confnotc_tot
    dtype: int64

  - raw_name: confnotc_udeliv
    dtype: int64

  - raw_name: confnotc_unret
    dtype: int64

  # --- Section A: Removals ---
  # remov_tot = A12a in the 2024 survey instrument (renumbered from A9a in 2022).
  - raw_name: remov_tot
    dtype: int64

  - raw_name: remov_convic
    dtype: int64

  - raw_name: remov_novote
    dtype: int64

  # --- Section C (mail/UOCAVA transmittal and rejection) ---
  - raw_name: mail_trans_tot
    dtype: int64

  - raw_name: mail_ret
    dtype: int64

  - raw_name: mail_count
    dtype: int64

  - raw_name: mail_rej_tot
    dtype: int64

  - raw_name: mail_rej_late
    dtype: int64

  - raw_name: mail_rej_novotersign
    dtype: int64

  - raw_name: mail_rej_nowitnsign
    dtype: int64

  - raw_name: mail_rej_nomatchsign
    dtype: int64

  - raw_name: mail_rej_unofenvel
    dtype: int64

  - raw_name: mail_rej_missballot
    dtype: int64

  - raw_name: mail_rej_multballot
    dtype: int64

  - raw_name: mail_rej_unsealenvel
    dtype: int64

  - raw_name: mail_rej_noaddress
    dtype: int64

  - raw_name: mail_rej_death
    dtype: int64

  - raw_name: mail_rej_othcounted
    dtype: int64

  - raw_name: mail_rej_noreqdoc
    dtype: int64

  - raw_name: mail_rej_noapp
    dtype: int64

  # --- Section E: Provisional ballots ---
  - raw_name: prov_tot
    dtype: int64

  # E1b — fully counted provisionals; used in EAC rejection-rate denominator.
  - raw_name: prov_countfull
    dtype: int64

  # E1c — partially counted provisionals; used in EAC rejection-rate denominator.
  - raw_name: prov_countpart
    dtype: int64

  # E1d — rejected provisionals; use this not prov_rej_tot (E3 sum).
  - raw_name: prov_rej
    dtype: int64

  # E1e — other disposition (neither counted nor rejected); used in EAC denominator.
  - raw_name: prov_oth
    dtype: int64

  - raw_name: prov_rej_notreginstate
    dtype: int64

  - raw_name: prov_rej_wrongjuris
    dtype: int64

  - raw_name: prov_rej_wrongprecinct
    dtype: int64

  - raw_name: prov_rej_id
    dtype: int64

  - raw_name: prov_rej_incomplete
    dtype: int64

  - raw_name: prov_rej_missballot
    dtype: int64

  - raw_name: prov_rej_nosign
    dtype: int64

  - raw_name: prov_rej_nomatchsign
    dtype: int64

  - raw_name: prov_rej_alreadyvoted
    dtype: int64
