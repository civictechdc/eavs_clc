# Column mapping for the EAVS Time Series dataset v2.0 (2004–2024).
# Raw column names are the EAC 2024 "stem" naming convention introduced in v2.0.
# Canonical names are the pipeline-internal names used by aggregate.py and downstream.
#
# Source of truth for 2022→2024 name changes: EAVS_variable_crosswalk_2022_to_2024.xlsx
# ("2022-2024 Crosswalk" sheet, column D = 2024 stem).
# Two guide typos corrected per crosswalk notes (A9a→remov_tot, A3e→reg_rej).
version: "2.0"
columns:
  # --- Infrastructure ---
  - name: fips_code
    dtype: string
    raw_name: FIPSCode

  - name: jurisdiction_name
    dtype: string
    raw_name: Jurisdiction_Name

  - name: state
    dtype: string
    raw_name: State_Full

  - name: state_abbr
    dtype: string
    raw_name: State_Abbr

  - name: year
    dtype: int64
    raw_name: Year

  # --- Section F: Turnout ---
  # turnout_tot replaces F1a from the pre-2024 column naming convention.
  - name: F1a
    dtype: int64
    raw_name: turnout_tot

  - name: turnout_ed
    dtype: int64
    raw_name: turnout_ed

  - name: turnout_uocava
    dtype: int64
    raw_name: turnout_uocava

  - name: turnout_mail
    dtype: int64
    raw_name: turnout_mail

  - name: turnout_ev
    dtype: int64
    raw_name: turnout_ev

  # --- Section A: Registration totals ---
  - name: registered_eligible_voters
    dtype: int64
    raw_name: regist_tot

  - name: active_voters
    dtype: int64
    raw_name: regist_actv

  - name: inactive_voters
    dtype: float64
    raw_name: regist_inctv

  - name: total_registrations_received
    dtype: int64
    raw_name: reg_tot

  - name: new_valid_registrations
    dtype: int64
    raw_name: reg_valid

  - name: pre_registrations
    dtype: int64
    raw_name: reg_prereg

  - name: duplicate_registrations
    dtype: int64
    raw_name: reg_dup

  # reg_rej = A3f in the 2024 survey instrument (renumbered from A3e in 2022).
  # The crosswalk corrects the guide's erroneous reference to A3e.
  - name: rejected_registrations
    dtype: int64
    raw_name: reg_rej

  - name: intrajurisdiction_registration_updates
    dtype: int64
    raw_name: reg_injurischng

  - name: interjurisdiction_registration_updates
    dtype: int64
    raw_name: reg_outjurischng

  # --- Section A: Registration by channel ---
  - name: total_forms_mail_fax_email
    dtype: int64
    raw_name: regtot_mail

  - name: new_registrations_mail_fax_email
    dtype: int64
    raw_name: regnew_mail

  - name: duplicate_registrations_mail_fax_email
    dtype: int64
    raw_name: regdup_mail

  - name: rejected_registrations_mail_fax_email
    dtype: int64
    raw_name: regrej_mail

  - name: total_forms_in_person
    dtype: int64
    raw_name: regtot_inpers

  - name: new_registrations_in_person
    dtype: int64
    raw_name: regnew_inpers

  - name: duplicate_registrations_in_person
    dtype: int64
    raw_name: regdup_inpers

  - name: rejected_registrations_in_person
    dtype: int64
    raw_name: regrej_inpers

  - name: total_forms_online
    dtype: int64
    raw_name: regtot_online

  - name: new_registrations_online
    dtype: int64
    raw_name: regnew_online

  - name: duplicate_registrations_online
    dtype: int64
    raw_name: regdup_online

  - name: rejected_registrations_online
    dtype: int64
    raw_name: regrej_online

  - name: total_forms_dmv
    dtype: int64
    raw_name: regtot_dmv

  - name: new_registrations_dmv
    dtype: int64
    raw_name: regnew_dmv

  - name: duplicate_registrations_dmv
    dtype: int64
    raw_name: regdup_dmv

  - name: rejected_registrations_dmv
    dtype: int64
    raw_name: regrej_dmv

  - name: total_forms_mandatory_nvra
    dtype: int64
    raw_name: regtot_nvra

  - name: new_registrations_mandatory_nvra
    dtype: int64
    raw_name: regnew_nvra

  - name: duplicate_registrations_mandatory_nvra
    dtype: int64
    raw_name: regdup_nvra

  - name: rejected_registrations_mandatory_nvra
    dtype: int64
    raw_name: regrej_nvra

  - name: total_forms_disability_agency
    dtype: int64
    raw_name: regtot_stagncy

  - name: new_registrations_disability_agency
    dtype: int64
    raw_name: regnew_stagncy

  - name: duplicate_registrations_disability_agency
    dtype: int64
    raw_name: regdup_stagncy

  - name: rejected_registrations_disability_agency
    dtype: int64
    raw_name: regrej_stagncy

  # --- Section A: Confirmation notices ---
  - name: confirmation_notices_sent_total
    dtype: int64
    raw_name: confnotc_tot

  - name: confirmation_notices_undeliverable
    dtype: int64
    raw_name: confnotc_udeliv

  - name: confirmation_notices_status_unknown
    dtype: int64
    raw_name: confnotc_unret

  # --- Section A: Removals ---
  # remov_tot = A12a in the 2024 survey instrument (renumbered from A9a in 2022).
  # The crosswalk corrects the guide's erroneous reference to A9a.
  # Canonical name changed from voters_removed_total_2020_2022 (misleading) to
  # voters_removed_total — applies to all survey years.
  - name: voters_removed_total
    dtype: int64
    raw_name: remov_tot

  - name: voters_removed_felony
    dtype: int64
    raw_name: remov_convic

  - name: voters_removed_nonresponse
    dtype: int64
    raw_name: remov_novote

  # --- Section C (mail/UOCAVA transmittal and rejection) ---
  - name: mail_transmitted_total
    dtype: int64
    raw_name: mail_trans_tot

  - name: mail_returned_by_voters
    dtype: int64
    raw_name: mail_ret

  - name: mail_count
    dtype: int64
    raw_name: mail_count

  - name: mail_ballots_rejected_total
    dtype: int64
    raw_name: mail_rej_tot

  - name: mail_ballots_rejected_late
    dtype: int64
    raw_name: mail_rej_late

  - name: mail_ballots_rejected_missing_voter_signature
    dtype: int64
    raw_name: mail_rej_novotersign

  - name: mail_ballots_rejected_missing_witness_signature
    dtype: int64
    raw_name: mail_rej_nowitnsign

  - name: mail_ballots_rejected_non_matching_voter_signature
    dtype: int64
    raw_name: mail_rej_nomatchsign

  - name: mail_ballots_rejected_unofficial_envelope
    dtype: int64
    raw_name: mail_rej_unofenvel

  - name: mail_ballots_rejected_ballot_missing_from_envelope
    dtype: int64
    raw_name: mail_rej_missballot

  - name: mail_ballots_rejected_multiple_ballots_one_envelope
    dtype: int64
    raw_name: mail_rej_multballot

  - name: mail_ballots_rejected_envelope_not_sealed
    dtype: int64
    raw_name: mail_rej_unsealenvel

  - name: mail_ballots_rejected_no_resident_address
    dtype: int64
    raw_name: mail_rej_noaddress

  - name: mail_ballots_rejected_voter_deceased
    dtype: int64
    raw_name: mail_rej_death

  - name: mail_ballots_rejected_already_voted
    dtype: int64
    raw_name: mail_rej_othcounted

  - name: mail_ballots_rejected_missing_documentation
    dtype: int64
    raw_name: mail_rej_noreqdoc

  - name: mail_ballots_rejected_no_application
    dtype: int64
    raw_name: mail_rej_noapp

  # --- Section E: Provisional ballots ---
  - name: provisional_ballots_cast_total
    dtype: int64
    raw_name: prov_tot

  # E1b — fully counted provisionals; used in EAC rejection-rate denominator.
  - name: prov_countfull
    dtype: int64
    raw_name: prov_countfull

  # E1c — partially counted provisionals; used in EAC rejection-rate denominator.
  - name: prov_countpart
    dtype: int64
    raw_name: prov_countpart

  # E1d — rejected provisionals; use this not prov_rej_tot (E3 sum).
  - name: provisional_ballots_rejected_total
    dtype: int64
    raw_name: prov_rej

  # E1e — other disposition (neither counted nor rejected); used in EAC denominator.
  - name: prov_oth
    dtype: int64
    raw_name: prov_oth

  - name: prov_rej_not_registered
    dtype: int64
    raw_name: prov_rej_notreginstate

  - name: prov_rej_wrong_jurisdiction
    dtype: int64
    raw_name: prov_rej_wrongjuris

  - name: prov_rej_wrong_precinct
    dtype: int64
    raw_name: prov_rej_wrongprecinct

  - name: prov_rej_no_id
    dtype: int64
    raw_name: prov_rej_id

  - name: prov_rej_incomplete
    dtype: int64
    raw_name: prov_rej_incomplete

  - name: prov_rej_ballot_missing
    dtype: int64
    raw_name: prov_rej_missballot

  - name: prov_rej_no_signature
    dtype: int64
    raw_name: prov_rej_nosign

  - name: prov_rej_non_matching_signature
    dtype: int64
    raw_name: prov_rej_nomatchsign

  - name: prov_rej_already_voted
    dtype: int64
    raw_name: prov_rej_alreadyvoted
