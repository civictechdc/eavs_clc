[project]
name = "eavs-clc"
version = "0.0.1"
description = "Election Administration and Voting Survey (EAVS) data cleaning"
authors = [
    { name = "Civic Tech DC" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12"
dependencies = [
    "fastexcel>=0.13.0",
    "polars",
    "python-dotenv",
    "streamlit",
]

[dependency-groups]
dev = [
    "jupyterlab",
]
